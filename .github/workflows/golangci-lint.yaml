name: golangci-lint
on: pull_request

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: "^1.17"
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
